# Suivi des temples sans PC allume : toutes les 5 minutes, GitHub relit l'historique du coffre
# de guilde et publie le classement (data.json) sur la branche "data", lue par la page publique.
#
# Reset (chef de guilde uniquement) : bouton Admin de la page (instantane : la page ecrit elle-meme
# la nouvelle session sur la branche data, puis la synchro suivante range les tout derniers depots),
# ou onglet Actions > Temple tracker > Run workflow > "reset".
# Seuls les comptes avec un acces en ecriture au depot voient le bouton "Run workflow".
#
# Le POESESSID est un secret du depot (Settings > Secrets and variables > Actions > POESESSID) :
# chiffre, jamais affiche dans les logs, jamais dans le code.

name: Temple tracker

on:
  schedule:
    # Toutes les 5 min, decale de 2 min : GitHub est surcharge (et saute des taches) pile a l'heure.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "sync = relire l'historique maintenant ; reset = nouvelle session, tout le monde repart a 0"
        type: choice
        options:
          - sync
          - reset
        default: sync

permissions:
  contents: write

concurrency:
  group: temple-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Code du tracker
        uses: actions/checkout@v4

      - name: Etat et scores (branche data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          # 2 commits : le precedent doit etre present pour remplacer une simple "heure de
          # synchro" (amend) sans toucher a l'historique des scores.
          fetch-depth: 2

      - name: Lire l'historique du coffre de guilde
        shell: powershell
        env:
          POESESSID: ${{ secrets.POESESSID }}
          TRACKER_ACTION: ${{ inputs.action }}
        run: |
          if (-not $env:POESESSID) {
            Write-Host "Secret POESESSID absent : rien a faire. Ajoute-le dans Settings > Secrets and variables > Actions."
            exit 0
          }
          $reset = $env:TRACKER_ACTION -eq 'reset'
          & .\server.ps1 -Once -Reset:$reset -ConfigPath config.actions.json -StatePath data-branch\state.json -PublicPath data-branch\data.json
          exit 0

      - name: Publier le classement
        shell: bash
        working-directory: data-branch
        # Classement change : nouveau commit. Seule l'heure de synchro change : on remplace le
        # commit "heure de synchro" precedent, pour ne pas empiler 288 commits par jour.
        run: |
          if [ -z "$(git status --porcelain -- data.json)" ]; then
            echo "data.json inchange : rien a publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          beat="Derniere synchro (classement inchange)"
          newrev=$(grep -o '"rev":"[0-9a-f]*"' data.json || true)
          oldrev=$(git show HEAD:data.json 2>/dev/null | grep -o '"rev":"[0-9a-f]*"' || true)
          old=$(git rev-parse HEAD)
          # Un reset fait depuis la page pendant cette synchro a deja change la branche data :
          # on ne l'ecrase pas, la synchro suivante (lancee par la page) repart de sa version.
          push() {
            if git push -q "$@"; then return 0; fi
            remote=$(git ls-remote origin refs/heads/data | cut -f1)
            if [ -n "$remote" ] && [ "$remote" != "$old" ]; then
              echo "::notice::Branche data modifiee pendant la synchro (reset depuis la page) : rien publie, la synchro suivante reprend."
              exit 0
            fi
            exit 1
          }
          git add data.json state.json
          if [ -n "$newrev" ] && [ "$newrev" = "$oldrev" ] && [ "$(git log -1 --format=%s)" = "$beat" ] && git rev-parse -q --verify HEAD~1 >/dev/null; then
            git commit -q --amend -m "$beat"
            push --force-with-lease=data:"$old" origin HEAD:data
            echo "Heure de synchro publiee (commit precedent remplace)."
          else
            msg="Scores mis a jour"
            if [ -n "$newrev" ] && [ "$newrev" = "$oldrev" ]; then msg="$beat"; fi
            git commit -q -m "$msg"
            push origin HEAD:data
            echo "Publie : $msg"
          fi
